<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrowattDesign</title>
<style>
  :root{
    --bg:#f3f4f2; --card:#ffffff; --card2:#f7f8f6; --line:#e5e7e2; --line2:#d3d6cd;
    --text:#1a1d1a; --mut:#666b63; --faint:#8d928a;
    --grn:#68b828; --grnD:#4c8a1a; --grnBg:#eef8e3; --grnLine:#c9e8ab;
    --amb:#b9740a; --ambBg:#fdf5e6; --ambLine:#f1d9a3;
    --red:#d92d2d; --redBg:#fdecec; --redLine:#f5c2c2;
    --slate:#475569;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(16,27,45,.04),0 6px 18px rgba(16,27,45,.06);
    --sbw:clamp(460px, calc((100vw - 52px) * 0.68), 1500px); --sbgap:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
  .page{max-width:none;margin:0;padding:22px 18px 96px}
  .topbar{display:flex;align-items:center;gap:11px;margin-bottom:18px}
  .topbar>div:nth-child(2){flex:1}
  .aibtn{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#1a2f22,#0f1b2d);color:#8ffcb8;border:1px solid #2c9d5e;padding:9px 15px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}
  .aibtn:hover{box-shadow:0 0 0 3px rgba(51,218,122,.18)}
  .opt.ai .name svg{color:var(--grn);vertical-align:-2px;margin-right:2px}
  .opt.compact{padding:7px 8px}
  .opt.compact .name{font-size:11.5px}
  .opt.compact .meta{font-size:9.5px;margin-top:1px;line-height:1.25}
  .dongrid{grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:7px}
  @media(max-width:560px){.dongrid{grid-template-columns:1fr 1fr}}

  /* ===== Growatt AI info page \u2014 deliberately distinct visual language ===== */
  .aipage{margin:-22px -14px -96px;background:#0b1420;color:#e7edf5;min-height:100vh;font-family:inherit}
  .ai-hero{position:relative;overflow:hidden;padding:26px 22px 34px;background:radial-gradient(1200px 500px at 15% -10%,rgba(51,218,122,.28),transparent),linear-gradient(160deg,#0f1b2d,#0a1420 60%,#0b1420)}
  .ai-back{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#cfe0d8;padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:22px}
  .ai-back:hover{background:rgba(255,255,255,.1)}
  .ai-badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#7bc736,#4c8a1a);color:#fff;font-weight:800;font-size:12px;letter-spacing:.06em;padding:6px 13px;border-radius:20px;margin-bottom:16px}
  .ai-hero h1{font-size:clamp(26px,4vw,38px);font-weight:800;margin:0 0 12px;letter-spacing:-.02em;background:linear-gradient(90deg,#fff,#bfe9cd);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;max-width:640px}
  .ai-tag{font-size:15.5px;color:#a9b8c9;max-width:560px;line-height:1.6}
  .ai-body{padding:8px 22px 60px;max-width:920px;margin:0 auto}
  .ai-section{margin:38px 0}
  .ai-section h2{font-size:20px;font-weight:750;color:#fff;margin:0 0 6px;letter-spacing:-.01em}
  .ai-section .ai-lead{color:#a9b8c9;font-size:14.5px;line-height:1.7;max-width:720px;margin-bottom:18px}
  .ai-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .ai-card{background:linear-gradient(155deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:20px}
  .ai-card .ic{width:38px;height:38px;border-radius:11px;background:rgba(51,218,122,.14);color:#5eeb96;display:flex;align-items:center;justify-content:center;margin-bottom:13px}
  .ai-card h3{font-size:14.5px;font-weight:700;color:#fff;margin:0 0 7px}
  .ai-card p{font-size:13px;color:#9fb0c2;line-height:1.6;margin:0}
  .ai-modes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .ai-mode{border-radius:16px;padding:22px;border:1px solid rgba(255,255,255,.09)}
  .ai-mode.auto{background:linear-gradient(155deg,rgba(51,218,122,.13),rgba(51,218,122,.02))}
  .ai-mode.man{background:linear-gradient(155deg,rgba(96,150,255,.13),rgba(96,150,255,.02))}
  .ai-mode .tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:20px;margin-bottom:11px}
  .ai-mode.auto .tag{background:rgba(51,218,122,.22);color:#8ffcb8}
  .ai-mode.man .tag{background:rgba(96,150,255,.22);color:#a9c7ff}
  .ai-mode h3{font-size:16px;font-weight:750;color:#fff;margin:0 0 8px}
  .ai-mode p{font-size:13.5px;color:#aebccb;line-height:1.65;margin:0}
  .ai-steps{counter-reset:aistep;display:flex;flex-direction:column;gap:3px}
  .ai-step{display:flex;gap:14px;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
  .ai-step:last-child{border-bottom:none}
  .ai-step .n{counter-increment:aistep;flex-shrink:0;width:26px;height:26px;border-radius:50%;background:rgba(51,218,122,.15);color:#8ffcb8;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
  .ai-step .n::before{content:counter(aistep)}
  .ai-step .tx b{color:#fff;font-size:13.5px}
  .ai-step .tx p{margin:3px 0 0;font-size:13px;color:#9fb0c2;line-height:1.6}
  .ai-pillrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  .ai-pill{font-size:11.5px;font-weight:650;color:#bfe9cd;background:rgba(51,218,122,.1);border:1px solid rgba(51,218,122,.28);padding:5px 11px;border-radius:20px}
  .ai-req{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:22px}
  .ai-req .row{display:flex;gap:11px;align-items:flex-start;padding:9px 0}
  .ai-req .row .ic{color:#5eeb96;flex-shrink:0;margin-top:1px}
  .ai-req .row b{color:#fff}
  .ai-req .row p{margin:2px 0 0;font-size:13px;color:#9fb0c2;line-height:1.6}
  .ai-foot{text-align:center;padding:10px 0 4px;color:#647285;font-size:12px}
  @media(max-width:700px){.aipage{margin:-22px -14px -96px}.ai-hero{padding:20px 16px 26px}.ai-body{padding:6px 16px 60px}}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#7bc736,#4c8a1a);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .topbar h1{font-size:21px;font-weight:800;margin:0;letter-spacing:-.01em;color:#141613}
  .topbar .sub{color:var(--mut);font-size:12.5px;margin-top:3px}
  .topbar .accentbar{display:flex;gap:5px;margin-top:9px}
  .topbar .accentbar span{height:3px;border-radius:2px}
  .topbar .accentbar span:nth-child(1){width:26px;background:var(--faint);opacity:.35}
  .topbar .accentbar span:nth-child(2){width:34px;background:var(--grn)}
  .topbar .accentbar span:nth-child(3){width:26px;background:var(--faint);opacity:.35}
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line2);color:var(--text);padding:9px 13px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--grn);border-color:var(--grn);color:#fff}
  .btn.ok{background:var(--grnD);border-color:var(--grnD);color:#fff}
  .layout{display:block}
  @media(min-width:980px){.layout{padding-right:calc(var(--sbw) + var(--sbgap))}}
  .stepcol{display:flex;flex-direction:column;gap:16px;min-width:0}
  .step{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:14px;transition:box-shadow .25s,border-color .25s}
  .step.justarrived{animation:steparrive 1.1s ease}
  @keyframes steparrive{0%{box-shadow:var(--shadow),0 0 0 0 rgba(51,218,122,0)}18%{border-color:var(--grn);box-shadow:0 1px 2px rgba(16,27,45,.04),0 6px 18px rgba(16,27,45,.06),0 0 0 3px rgba(51,218,122,.28)}100%{border-color:var(--line);box-shadow:var(--shadow),0 0 0 0 rgba(51,218,122,0)}}
  .step-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .num{width:27px;height:27px;flex-shrink:0;border-radius:50%;background:var(--grnBg);border:1px solid var(--grnLine);color:var(--grnD);font-weight:750;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
  .step-h .ttl{font-weight:700;font-size:15px}
  .step-h .desc{font-size:12px;color:var(--mut);margin-top:1px}
  .step-b{padding:17px}
  .step.collapsed .step-b{display:none}
  .step.collapsed .step-h{border-bottom:none}
  .step-h[data-act]{cursor:pointer;user-select:none}
  .step-h[data-act]:hover{background:rgba(51,218,122,.05)}
  .chev{flex-shrink:0;color:var(--mut);display:flex;transition:transform .22s}
  .chev.up{transform:rotate(180deg);color:var(--grnD)}
  @media(min-width:980px){.stepcol{gap:10px}}
  .stepsum{flex-shrink:0;font-size:12px;font-weight:750;color:var(--grnD);background:var(--grnBg);border:1px solid var(--grnLine);border-radius:20px;padding:4px 11px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Wide screens: flow the always-open steps into two packed columns. */
  .stepcol{display:grid;grid-template-columns:118px minmax(0,1fr);gap:9px;align-items:start;zoom:.8}
  .steprail{display:flex;flex-direction:column;gap:5px;position:sticky;top:14px}
  .railbtn{display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 8px;
    cursor:pointer;font-family:inherit;color:var(--text);box-shadow:var(--shadow);
    transition:border-color .15s,background .15s}
  .railbtn:hover{border-color:var(--grnLine);background:rgba(51,218,122,.06)}
  .railbtn.on{border-color:var(--grn);background:var(--grnBg);box-shadow:inset 0 0 0 1px var(--grn)}
  .railbtn .rtop{display:flex;align-items:center;gap:6px;min-width:0}
  .railbtn .rn{flex-shrink:0;width:18px;height:18px;border-radius:50%;background:var(--grnBg);
    border:1px solid var(--grnLine);color:var(--grnD);font-weight:750;font-size:10px;
    display:flex;align-items:center;justify-content:center}
  .railbtn.on .rn{background:var(--grn);border-color:var(--grn);color:#fff}
  .railbtn .rt{font-size:11px;font-weight:700;line-height:1.2;min-width:0}
  .railbtn .rs{font-size:9.5px;font-weight:700;color:var(--grnD);line-height:1.2;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:24px}
  .stepnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;
    padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
  .stepnav .btn{font-size:13px;padding:9px 14px}
  .stepnav .btn.primary{font-weight:750}
  .stepnav .nx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
  .steppane .step{margin:0}
  .steppane .chev{display:none}
  .steppane .step-h[data-act]{cursor:default}
  .steppane .step-h[data-act]:hover{background:none}
  @media(max-width:900px){.stepcol{grid-template-columns:1fr}.steprail{position:static;flex-direction:row;flex-wrap:wrap}.railbtn{flex:1 1 30%}}

  /* Compact scale for the options pane \u2014 keeps all six steps visible without scrolling. */
  .stepcol{font-size:13px}
  .stepcol .step{border-radius:12px}
  .stepcol .step-h{padding:9px 11px;gap:8px}
  .stepcol .num{width:21px;height:21px;font-size:11px}
  .stepcol .step-h .ttl{font-size:13px}
  .stepcol .step-h .desc{font-size:10.5px;line-height:1.35}
  .stepcol .stepsum{font-size:10.5px;padding:2px 8px;max-width:150px}
  .stepcol .optbadge{font-size:9px;padding:1px 6px;margin-left:5px}
  .stepcol .step-b{padding:10px}
  .stepcol .grid{gap:6px}
  .stepcol .opt{padding:7px 8px;border-radius:9px}
  .stepcol .opt .name{font-size:12px}
  .stepcol .opt .meta{font-size:10px;margin-top:2px;line-height:1.3}
  .stepcol .opt .x{font-size:9px;margin-top:3px}
  .stepcol .badge{font-size:9px;padding:1px 6px;margin-top:4px}
  .stepcol .chip{padding:5px 9px;font-size:11.5px;border-radius:7px}
  .stepcol .note,.stepcol .notice{font-size:10.5px;padding:7px 9px;margin-top:7px;gap:6px;line-height:1.4;border-radius:8px}
  .stepcol .sublabel{font-size:10.5px;margin:9px 0 5px}
  .stepcol .switchrow{padding:8px 10px;border-radius:9px;gap:8px}
  .stepcol .switchrow .lab{font-size:12px}
  .stepcol .switchrow .s2{font-size:10px;line-height:1.35}
  .stepcol .sw{width:38px;height:21px}
  .stepcol .knob{width:15px;height:15px}
  .stepcol .sw.on .knob{left:20px}
  .stepcol .field{gap:4px}
  .stepcol .field label{font-size:10.5px}
  .stepcol .field input,.stepcol .field select{padding:7px 9px;font-size:13px;border-radius:8px}
  .stepcol .field .unit{font-size:9.5px}
  .stepcol .locked,.stepcol .reqcard{padding:9px 10px;gap:8px;border-radius:9px}
  .stepcol .locked .t,.stepcol .reqcard .t{font-size:12px}
  .stepcol .locked .s,.stepcol .reqcard .s{font-size:10.5px;line-height:1.35}
  .stepcol .pverr{padding:7px 9px;font-size:10.5px;border-radius:8px}
  .stepcol .tower{padding:9px;border-radius:10px}
  .stepcol .tower+.tower{margin-top:7px}
  .stepcol .tower-h{margin-bottom:7px}
  .stepcol .tower-h .nm,.stepcol .tower-h .kw{font-size:11.5px}
  .stepcol .modrow+.modrow{margin-top:6px}
  .stepcol .modrow .lab{font-size:11px}
  .stepcol .totrow{font-size:10px;margin-top:6px}
  .stepcol .unittabs{padding:6px 8px;gap:5px;margin-bottom:8px}
  .stepcol .uchip{padding:4px 8px;font-size:10.5px}
  .stepcol .pvtop{padding:9px 10px;margin-top:9px;border-radius:9px}
  .stepcol .batlabel{font-size:9.5px;padding:1px 6px}
  /* three-up option grids get cramped in a narrow column */
  @media(max-width:1750px){.stepcol .g3{grid-template-columns:1fr 1fr}}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:560px){.g3{grid-template-columns:1fr 1fr}}
  .opt{min-width:0;overflow:hidden;text-align:left;border:1px solid var(--line2);background:var(--card2);border-radius:12px;padding:12px 13px;cursor:pointer;font-family:inherit;color:var(--text)}
  .opt.on{border-color:var(--grn);background:var(--grnBg);box-shadow:inset 0 0 0 1px var(--grn)}
  .opt .name{font-weight:700;font-size:14px;overflow-wrap:anywhere;word-break:break-word}
  .opt.on .name{color:var(--grnD)}
  .opt .meta{font-size:11.5px;color:var(--mut);margin-top:3px}
  .opt.crossed{opacity:.55;cursor:not-allowed;background:#f1f4f8}
  .opt.crossed .name{text-decoration:line-through;color:var(--faint)}
  .opt.invalidsel{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
  .opt .x{color:var(--red);font-weight:700;font-size:10.5px;margin-top:6px;display:flex;align-items:center;gap:4px}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;margin-top:7px}
  .badge.g{background:var(--grnBg);color:var(--grnD);border:1px solid var(--grnLine)}
  .badge.a{background:var(--ambBg);color:var(--amb);border:1px solid var(--ambLine)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line2);background:var(--card2);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text)}
  .chip.on{border-color:var(--grn);background:var(--grn);color:#fff}
  .chip.sm{padding:6px 11px;font-size:12.5px}
  .chip.crossed{opacity:.5;cursor:not-allowed;text-decoration:line-through;color:var(--faint);background:#f1f4f8;border-color:var(--line)}
  .unittabs{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:13px;padding:9px 11px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--faint)}
  .uchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text)}
  .uchip.on{border-color:var(--grn);background:var(--grnBg);color:var(--grnD)}
  .uchip b{opacity:.55;font-weight:800;padding:0 2px;cursor:pointer}
  .uchip b:hover{opacity:1;color:var(--red)}
  .note{display:flex;gap:8px;margin-top:12px;font-size:12px;color:var(--mut);line-height:1.5;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .note .i{color:var(--amb);flex-shrink:0;margin-top:1px}
  .note b{color:var(--text)}
  .sublabel{font-size:12px;color:var(--mut);font-weight:600;margin:14px 0 8px}
  .optbadge{display:inline-block;font-size:10.5px;font-weight:700;color:var(--mut);background:var(--card2);border:1px solid var(--line2);border-radius:20px;padding:2px 8px;margin-left:8px;vertical-align:middle}
  .pvtop{margin-top:14px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
  .pvtop.over{background:var(--redBg);border-color:var(--redLine)}
  .pvrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .pvbig{font-family:var(--mono);font-size:28px;font-weight:800;color:var(--grnD)}
  .pvbig small{font-size:14px;color:var(--mut);font-weight:500}
  .pvhint{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:7px;line-height:1.4}
  .pvhint b{color:var(--text)}
  .gauge{margin-top:13px}
  .gtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
  .gnum{font-family:var(--mono);font-size:22px;font-weight:800;color:var(--grnD);flex-shrink:0}
  .gnum.over{color:var(--red)}
  .ghead{font-size:11.5px;color:var(--mut);text-align:right;line-height:1.35}
  .ghead b{color:var(--text)}
  .gtrack{position:relative;height:13px;background:#e3e9f2;border-radius:7px;overflow:hidden}
  .gfill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#82c94a,#68b828);transition:width .3s;border-radius:7px}
  .gfill.over{background:linear-gradient(90deg,#e8863a,#d92d2d)}
  .gmid{position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(15,27,45,.14)}
  .gscale{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);margin-top:4px;font-family:var(--mono)}
  .locked{display:flex;align-items:center;gap:11px;background:var(--grnBg);border:1px solid var(--grnLine);border-radius:12px;padding:14px 15px}
  .locked .ico{color:var(--grnD);flex-shrink:0}
  .locked .t{font-weight:700;font-size:14px;color:var(--grnD)}
  .locked .s{font-size:12px;color:var(--grnD);opacity:.85;margin-top:2px}
  .reqcard{display:flex;align-items:center;gap:11px;background:var(--ambBg);border:1px solid var(--ambLine);border-radius:12px;padding:14px 15px}
  .reqcard .ico{color:var(--amb);flex-shrink:0}
  .reqcard .t{font-weight:700;font-size:14px;color:var(--amb)}
  .reqcard .s{font-size:12px;color:#7a5a18;margin-top:2px}
  .placeholder{display:flex;align-items:center;gap:9px;background:var(--card2);border:1px dashed var(--line2);border-radius:12px;padding:15px;color:var(--mut);font-size:13px}
  .placeholder .i{color:var(--faint);flex-shrink:0}

function invModelSVG(cx,cy,boxW,name,baseFs){
  if(!name)return '';
  var parts=name.split(' '), l1=parts[0], l2=parts.slice(1).join(' ');
  if(!l2){l1=name;}
  var longest=Math.max(l1.length,l2.length);
  var fs=Math.min(baseFs,(boxW-7)/(longest*0.66));
  if(fs<2.6)fs=2.6;
  var o='';
  if(l2){
    o+='<text x="'+cx+'" y="'+(cy-fs*0.22).toFixed(1)+'" text-anchor="middle" font-size="'+fs.toFixed(1)+'" font-weight="800" fill="#1f7a45">'+l1+'</text>';
    o+='<text x="'+cx+'" y="'+(cy+fs*0.98).toFixed(1)+'" text-anchor="middle" font-size="'+fs.toFixed(1)+'" font-weight="800" fill="#1f7a45">'+l2+'</text>';
  } else {
    o+='<text x="'+cx+'" y="'+(cy+fs*0.35).toFixed(1)+'" text-anchor="middle" font-size="'+fs.toFixed(1)+'" font-weight="800" fill="#1f7a45">'+l1+'</text>';
  }
  return o;
}
function modelName(famKey,kw){
  var f=FAMILIES[famKey]; if(!f)return '';

  var k=(Math.round(kw*10)/10).toString().replace(/\.0$/,'');
  switch(famKey){
    case 'MOD-HU':  return 'MOD '+k+'KTL3\u2011HU';
    case 'MOD-XH':  return 'MOD '+k+'KTL3\u2011XH(BP)';
    case 'MID-XH':  return 'MID '+k+'KTL3\u2011XH';
    case 'MID-HU':  return 'MID '+k+'K\u2011HU';
    case 'MODA':    return 'MODA '+k+'KTL3';

}
function isAxeFam(){return !!(fam()&&fam().battery==='AXE');}

function clampInputs(){
  if(!state.family)return;
  if(fam().battery==='RISE'){state.inputs=[];return;}
  if(fam().battery==='MODA'){
    if(!state.inputs.length)state.inputs=[{modules:3}];
    state.inputs=state.inputs.slice(0,1);
    var mi=state.inputs[0];
    if(typeof mi.modules!=='number'||isNaN(mi.modules))mi.modules=3;
    mi.modules=clamp(mi.modules,1,6);
    return;
  }
  if(isAxeFam()){
    state.inputs.forEach(function(inp){
      if(typeof inp.modules!=='number'||isNaN(inp.modules))inp.modules=6;
      inp.modules=clamp(inp.modules,1,AXE_MAX_MODULES);
    });
    return;
  }
  state.inputs=state.inputs.slice(0,maxInputs());
  state.inputs.forEach(function(inp){
    if(typeof inp.mods!=='number'||isNaN(inp.mods))inp.mods=a2()?4:4;
    if(typeof inp.c1!=='number'||isNaN(inp.c1))inp.c1=inp.mods;
    if(typeof inp.c2!=='number'||isNaN(inp.c2))inp.c2=0;
    if(a2()){
      // APX 2.0: stacks like 1.0 \u2014 1 or 2 towers per input.
      // Cap stays at 5 add\u2011on modules per input (the BMS carries its own 5 kWh on top).
      if(inp.cols===2){
        inp.c1=clamp(inp.c1||0,0,4);inp.c2=clamp(inp.c2||1,1,5);
        if(inp.c1+inp.c2>5){if(inp.c1>=inp.c2)inp.c1=5-inp.c2;else inp.c2=5-inp.c1;}
        inp.mods=inp.c1+inp.c2;
      } else {
        inp.cols=1;inp.mods=clamp(inp.mods,0,5);inp.c1=inp.mods;inp.c2=0;
      }
    } else {
      if(inp.cols===2){
        inp.c1=clamp(inp.c1||1,1,5);inp.c2=clamp(inp.c2||1,1,5);
        if(inp.c1+inp.c2>6){if(inp.c1>=inp.c2)inp.c1=6-inp.c2;else inp.c2=6-inp.c1;}
        inp.mods=inp.c1+inp.c2;
      } else {
        inp.cols=1;inp.mods=clamp(inp.mods,1,6);inp.c1=inp.mods;inp.c2=0;
      }

}
function batteryTotals(){
  if(fam()&&fam().battery==='RISE'){return {mods:0,bms:0,kwh:(state.family&&state.kw)?261:0,bases:0,cascades:0,inputs:1};}

    var m=state.inputs.reduce(function(s,i){return s+i.modules;},0);
    return {mods:m,bms:0,kwh:Math.round(m*AXE_MODULE_KWH*100)/100,bases:0,cascades:0,inputs:state.inputs.length};
  }
  var mods=state.inputs.reduce(function(s,i){return s+i.mods;},0);

}

function pvRealistic(cxCenter,bottomY,w,h){
  var x0=cxCenter-w/2, y0=bottomY-h;
  var uid='pv'+Math.round(x0*7+y0*13+w*3+h);
  var s='<defs><linearGradient id="'+uid+'" x1="0" y1="0" x2="1" y2="1">'+
    '<stop offset="0" stop-color="#ffffff" stop-opacity=".26"></stop>'+
    '<stop offset="0.42" stop-color="#ffffff" stop-opacity=".05"></stop>'+
    '<stop offset="0.55" stop-color="#ffffff" stop-opacity=".16"></stop>'+
    '<stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop></linearGradient></defs>';
  // anodised aluminium frame
  s+='<rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" rx="1.4" fill="#c9ced4" stroke="#8d949c" stroke-width="0.9"></rect>';
  s+='<rect x="'+(x0+0.5)+'" y="'+(y0+0.5)+'" width="'+(w-1)+'" height="'+(h-1)+'" rx="1.1" fill="none" stroke="#eef1f4" stroke-width="0.5" opacity=".7"></rect>';
  var pad=Math.max(Math.min(w,h)*0.055,1.1);
  var ix=x0+pad, iy=y0+pad, iw=w-2*pad, ih=h-2*pad;
  // dark laminate behind the cells
  s+='<rect x="'+ix.toFixed(2)+'" y="'+iy.toFixed(2)+'" width="'+iw.toFixed(2)+'" height="'+ih.toFixed(2)+'" fill="#0b1righ"></rect>'.replace('0b1righ','0b1018');
  var rows=2;
  var cols=Math.max(5,Math.min(12,Math.round(iw/(ih/rows)*1.7)));
  var band=ih*0.055;                       // busbar gap between the two cell rows
  var cw=iw/cols, ch=(ih-band)/rows;
  var gx=cw*0.075, gy=ch*0.06;
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var cx=ix+c*cw+gx, cy=iy+r*(ch+band)+gy;
      var ww=cw-2*gx, hh=ch-2*gy;
      var k=Math.min(Math.min(cw,ch)*0.22,ww*0.3,hh*0.3);   // chamfered monocrystalline corners
      var pts=[[cx+k,cy],[cx+ww-k,cy],[cx+ww,cy+k],[cx+ww,cy+hh-k],[cx+ww-k,cy+hh],[cx+k,cy+hh],[cx,cy+hh-k],[cx,cy+k]]
        .map(function(pt){return pt[0].toFixed(2)+','+pt[1].toFixed(2);}).join(' ');
      s+='<polygon points="'+pts+'" fill="#1a2233"></polygon>';
      s+='<polygon points="'+pts+'" fill="none" stroke="#2b3550" stroke-width="0.22"></polygon>';
      if(ww>3){   // fine silver fingers + two busbars per cell

          s+='<line x1="'+fxr.toFixed(2)+'" y1="'+cy.toFixed(2)+'" x2="'+fxr.toFixed(2)+'" y2="'+(cy+hh).toFixed(2)+'" stroke="#93a2b6" stroke-width="0.14" opacity=".55"></line>';
        }
        s+='<line x1="'+(cx+ww*0.33).toFixed(2)+'" y1="'+cy.toFixed(2)+'" x2="'+(cx+ww*0.33).toFixed(2)+'" y2="'+(cy+hh).toFixed(2)+'" stroke="#cfd8e4" stroke-width="0.3" opacity=".9"></line>';
        s+='<line x1="'+(cx+ww*0.67).toFixed(2)+'" y1="'+cy.toFixed(2)+'" x2="'+(cx+ww*0.67).toFixed(2)+'" y2="'+(cy+hh).toFixed(2)+'" stroke="#cfd8e4" stroke-width="0.3" opacity=".9"></line>';

  s+='<rect x="'+ix.toFixed(2)+'" y="'+(iy+ch).toFixed(2)+'" width="'+iw.toFixed(2)+'" height="'+band.toFixed(2)+'" fill="#0b1018"></rect>';
  s+='<line x1="'+ix.toFixed(2)+'" y1="'+(iy+ch+band/2).toFixed(2)+'" x2="'+(ix+iw).toFixed(2)+'" y2="'+(iy+ch+band/2).toFixed(2)+'" stroke="#5c6a80" stroke-width="0.25" opacity=".8"></line>';
  // glass sheen across the whole laminate

        req('activity','A supported market','Sweden is on the list above \u2014 the mode relies on day\u2011ahead price data that\u2019s only published in these regions today.')+
      '</div></div>'+
      '<div class="ai-foot">Summarised from Growatt\u2019s \u201cAI\u2011Powered Energy Assistant: Smart Scheduling Mode\u201d technical white paper. Always confirm current device support with your distributor before quoting a customer.</div>'+
    '</div></div>';
}
function render(){
  if(state.segment!=='res')state.highRes=false;
  if(state.page==='ai'){
    document.getElementById('app').innerHTML='<div class="page">'+aiPageHTML()+'</div>';
    window.scrollTo({top:0,behavior:'instant'});
    return;
  }
  var html='<div class="page">'+
    '<div class="topbar"><div class="logo">'+ic('zap',19,'#fff')+'</div><div><h1>GrowattDesign</h1><div class="sub">Growatt \u00b7 MOD / MID / WIT + APX &amp; AXE</div><div class="accentbar"><span></span><span></span><span></span></div></div></div>'+
    '<div class="printhead"><div class="pt">Growatt Energy System \u2014 Bill of Materials</div><div class="pd">'+new Date().toLocaleDateString()+'</div></div>'+
    printRecapHTML()+
    '<div class="layout"><div class="stepcol"><nav class="steprail">'+railHTML()+'</nav><div class="steppane">'+activeStepHTML()+'</div></div>'+
    '<aside class="cartcol"><div id="scenewrap">'+housePhotoHTML()+'</div><div class="cart" id="cart">'+cartHTML()+'</div></aside></div>'+
    '<div class="cartbar" id="cartbar">'+cartbarHTML()+'</div></div>';
  document.getElementById('app').innerHTML=html;
}
function refreshKeepFocus(fn){
  var ae=document.activeElement;
  var aid=ae&&ae.id;
  var raw=(ae&&typeof ae.value==='string')?ae.value:null;
  var ss=(ae&&typeof ae.selectionStart==='number')?ae.selectionStart:null;
  var se=(ae&&typeof ae.selectionEnd==='number')?ae.selectionEnd:null;
  fn();
  if(aid){
    var el=document.getElementById(aid);
    if(el){
      // keep exactly what was typed (e.g. "4." keeps its dot) instead of the re-formatted value
      if(raw!==null&&typeof el.value==='string'&&el.value!==raw){try{el.value=raw;}catch(err){}}
      if(el!==document.activeElement){
        el.focus();
        if(ss!==null&&el.setSelectionRange){try{el.setSelectionRange(ss,se);}catch(err){}}
      }
    }
  }
}
// Typed values take effect straight away - warnings, guidance, the rail summary,
// the bill of materials and the diagram all follow the field as it is edited.
function refreshBackupStep(){
  var e1=document.getElementById('bkOverErr');if(e1)e1.innerHTML=bkOverErrHTML();
  var e2=document.getElementById('bkGuide');if(e2)e2.innerHTML=backupGuidanceHTML();
  var lc=document.getElementById('loadCalc');if(lc)lc.innerHTML=loadCalcHTML();
  var f=document.getElementById('backupLoadKw');if(f){if(bkOverload())f.classList.add('bad');else f.classList.remove('bad');}
  var r=document.querySelector('.steprail');if(r)r.innerHTML=railHTML();
  var c=document.getElementById('cart');if(c)c.innerHTML=cartHTML();
  var d=document.getElementById('cartbar');if(d)d.innerHTML=cartbarHTML();
  var sw=document.getElementById('scenewrap');if(sw)sw.innerHTML=housePhotoHTML();
}
function onLoadKw(){ refreshBackupStep(); }
function onBackupLoadKw(){ refreshBackupStep(); }
function onPanels(){
  if(state.family&&state.kw&&state.panelCount>0&&!kwValid(state.kw)){var v=fam().kw.filter(kwValid);if(v.length)state.kw=v[0];}
  var a=document.getElementById('pvTop');if(a)a.innerHTML=pvTopHTML();
  var b=document.getElementById('invFamSection');if(b)b.innerHTML=invFamSectionHTML();
  var c=document.getElementById('cart');if(c)c.innerHTML=cartHTML();
  var d=document.getElementById('cartbar');if(d)d.innerHTML=cartbarHTML();
  var sw=document.getElementById('scenewrap');if(sw)sw.innerHTML=housePhotoHTML();
}
document.addEventListener('click',function(e){
  if(state.openHot&&!(e.target.closest&&e.target.closest('[data-hot="'+state.openHot+'"]'))){state.openHot=null;render();}
  var el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act');
  var uAttrEl=el.getAttribute('data-u');if(uAttrEl!==null){var uTarget=+uAttrEl;if(uTarget!==state.unit&&state.units[uTarget]){switchUnit(uTarget);}}
  if(a==='hottoggle'){var hid=el.getAttribute('data-hot');state.openHot=(state.openHot===hid)?null:hid;render();}
  else if(a==='fam'){var k=el.getAttribute('data-k');if(!famValid(k))return;if(k==='MODA'&&state.multi&&state.units.length>1)return;
    if(state.family&&state.family!==k){
      // A different inverter changes what the rest of the system can be \u2014 start the flow over.
      state.dongle=null;state.metering=null;state.meterType='TPM-6CT-C';
      state.backupOn=false;state.backupMode=null;state.backupLoadKw=0;state.synOptIn=false;
      state.wantBattery=null;state.inputs=[];state.apx='1.0';
      state.thirdParty=false;state.tpCount=1;state.tpLabels=['','',''];
      state.offGrid=false;state.inverterBroken=false;state.bypassOn=false;
      state.aiMode=false;state.aiSmart=false;state.aiPeak=false;state.aiUnbal=false;
      state.loadKw=0;state.mainFuseA=null;state.groHomeMode='rs485';state.openHot=null;
    }
    state.family=k;var f=FAMILIES[k];var v=f.kw.filter(kwValid);state.kw=v.length?v[0]:f.kw[0];
    state.inputs=(f.battery==='MODA')?state.inputs:state.inputs.slice(0,f.inputs);
    if(f.battery==='MODA')state.wantBattery=true;clampInputs();render();}
  else if(a==='kw'){var p=+el.getAttribute('data-p');if(!kwValid(p))return;state.kw=p;
    if(state.family==='RISE-261'&&state.units.length>1){syncUnit();state.units.forEach(function(u){if(u.family==='RISE-261')u.kw=p;});}
    render();}
  else if(a==='seg'){var sg=el.getAttribute('data-s');
    if(state.segment!==sg){
      // Switching segment starts the whole configuration over \u2014 inverter, battery, metering, backup, everything.
      state.segment=sg;
      state.highRes=false;state.multi=false;state.offGrid=false;state.inverterBroken=false;state.bypassOn=false;
      state.thirdParty=false;state.tpCount=1;state.tpLabels=['','',''];
      state.synOptIn=false;state.groHomeMode='rs485';
      state.aiMode=false;state.aiSmart=false;state.aiPeak=false;state.aiUnbal=false;
      state.panelW=450;state.panelCount=0;
      state.family=null;state.kw=null;state.dongle=null;state.metering=null;state.meterType='TPM-6CT-C';
      state.backupOn=false;state.apx='1.0';state.inputs=[];state.wantBattery=null;
      state.loadKw=0;state.backupMode=null;state.backupLoadKw=0;state.mainFuseA=null;
      state.openHot=null;
      state.unit=0;state.units=[];syncUnit();
    }
    render();}
  else if(a==='tpcount'){state.tpCount=parseInt(el.getAttribute('data-n'),10)||1;render();}
  else if(a==='synoptin'){state.synOptIn=!state.synOptIn;render();}
  else if(a==='offgrid'){state.offGrid=!state.offGrid;state.inverterBroken=false;render();}
  else if(a==='invbroken'){state.inverterBroken=!state.inverterBroken;if(state.inverterBroken)state.offGrid=false;render();}
  else if(a==='bypasson'){state.bypassOn=!state.bypassOn;render();}
  else if(a==='togglehighres'){state.highRes=!state.highRes;render();}
  else if(a==='gopv'){state.openStep='stp-inv';render();setTimeout(function(){var el=document.getElementById('panelCount');if(el){el.focus();el.select&&el.select();}},60);}
  else if(a==='stepopen'){var sid=el.getAttribute('data-s');state.openStep=sid;render();}
  else if(a==='grohomemode'){state.groHomeMode=el.getAttribute('data-v');render();}
  else if(a==='aimode'){state.aiMode=!state.aiMode;if(!state.aiMode){state.aiSmart=false;state.aiPeak=false;state.aiUnbal=false;}else{state.aiSmart=true;}render();}
  else if(a==='aismart'){state.aiSmart=!state.aiSmart;render();}
  else if(a==='aipeak'){state.aiPeak=!state.aiPeak;render();}
  else if(a==='aiunbal'){state.aiUnbal=!state.aiUnbal;render();}
  else if(a==='thirdparty'){state.thirdParty=!state.thirdParty;
    if(state.thirdParty){state.metering='meter';state.meterType=(state.family==='MODA')?'TPM-6CT-C':state.meterType;}
    else if(state.meterType==='TPM-6CT-C'){state.meterType='TPM-C';}
    render();}
  else if(a==='highres'){state.highRes=!state.highRes;render();}
  else if(a==='multi'){state.multi=!state.multi;if(state.multi&&state.dongle!=='shinesem'&&state.dongle!=='shinemaster')state.dongle=null;if(!state.multi){syncUnit();state.units=[state.units[state.unit]];state.unit=0;loadUnit(state.units[0]);}render();}
  else if(a==='unit'){var stepEl=el.closest('.step'),stepId=stepEl?stepEl.id:null;switchUnit(+el.getAttribute('data-i'));render();
    if(stepId==='stp-inv'){var pv1=document.getElementById('pvInputsTop');if(pv1)pv1.scrollIntoView({block:'start',behavior:'smooth'});}
    else if(stepId){var freshStep=document.getElementById(stepId);if(freshStep)freshStep.scrollIntoView({block:'start',behavior:'smooth'});}}
  else if(a==='unitadd'){var wasInInvStep2=!!el.closest('#stp-inv');addUnit();render();if(wasInInvStep2){var pv2=document.getElementById('pvInputsTop');if(pv2)pv2.scrollIntoView({block:'start',behavior:'smooth'});}}
  else if(a==='unitdel'){removeUnit(+el.getAttribute('data-i'));render();}
  else if(a==='goai'){state.page='ai';render();}
  else if(a==='goback'){state.page='main';render();}
  else if(a==='dongle'){var k=el.getAttribute('data-k');if(state.multi&&state.units.length>1&&k!=='shinesem'&&k!=='shinemaster'&&k!=='grohome')return;var wasNull=!state.dongle;state.dongle=(state.dongle===k)?null:k;render();}
  else if(a==='metering'){var m=el.getAttribute('data-m');state.metering=(state.metering===m)?null:m;if(state.metering==='meter')state.meterType='TPM-6CT-C';render();}
  else if(a==='mt'){state.meterType=el.getAttribute('data-t');render();}
  else if(a==='backup'){state.backupOn=!state.backupOn;render();}
  else if(a==='backupmode'){var v=el.getAttribute('data-v');state.backupMode=(state.backupMode===v)?null:v;render();}
  else if(a==='apx'){state.apx=el.getAttribute('data-v');clampInputs();render();}
  else if(a==='inputs'){var n=+el.getAttribute('data-n');if(n>fam().inputs)return;if(!isAxeFam()&&n>maxInputs())return;var axe=isAxeFam();while(state.inputs.length<n)state.inputs.push(axe?{modules:6}:{mods:4,cols:1,c1:4,c2:0});state.inputs=state.inputs.slice(0,n);clampInputs();render();}
  else if(a==='mod'){var j=+el.getAttribute('data-i'),dd=+el.getAttribute('data-d');var inp=state.inputs[j];var cur=(typeof inp.mods==='number'&&!isNaN(inp.mods))?inp.mods:minMods();inp.mods=clamp(cur+dd,minMods(),maxMods());inp.c1=inp.mods;inp.c2=0;render();}
  else if(a==='colmod'){var j=+el.getAttribute('data-i'),col=el.getAttribute('data-col'),dd=+el.getAttribute('data-d');var inp=state.inputs[j],mx=maxMods();
    if(col==='c1'){var nv=inp.c1+dd;if(dd>0){if(nv+inp.c2<=mx)inp.c1=nv;}else{if(nv>=(a2()?0:1))inp.c1=nv;}}
    else{var nv2=inp.c2+dd;if(dd>0){if(inp.c1+nv2<=mx)inp.c2=nv2;}else{if(nv2>=1)inp.c2=nv2;}}
    inp.mods=inp.c1+inp.c2;render();}
  else if(a==='axemod'){var j=+el.getAttribute('data-i'),dd=+el.getAttribute('data-d');var inp=state.inputs[j];inp.modules=clamp(inp.modules+dd,1,AXE_MAX_MODULES);render();}
  else if(a==='modamod'){var dd=+el.getAttribute('data-d');if(!state.inputs[0])state.inputs=[{modules:3}];state.inputs[0].modules=clamp(state.inputs[0].modules+dd,1,6);render();}
  else if(a==='cols'){var j=+el.getAttribute('data-i'),cc=+el.getAttribute('data-c');var inp=state.inputs[j];
    if(cc===2){var need=2;if(inp.mods<need)return;inp.cols=2;
      if(a2()){inp.c2=Math.max(1,Math.floor(inp.mods/2));inp.c1=inp.mods-inp.c2;}
      else{inp.c1=Math.ceil(inp.mods/2);inp.c2=Math.floor(inp.mods/2);if(inp.c1<1)inp.c1=1;if(inp.c2<1)inp.c2=1;}}
    else{inp.cols=1;inp.mods=inp.c1+inp.c2;}
    render();}
  else if(a==='wantbat'){var v=el.getAttribute('data-v');state.wantBattery=(v==='yes');
    if(v==='no')state.inputs=[];
    else if(v==='yes'&&state.inputs.length===0){var axe0=isAxeFam();state.inputs=[axe0?{modules:6}:{mods:4,cols:1,c1:4,c2:0}];clampInputs();}
    render();}
  else if(a==='print'){window.print();}
  else if(a==='tocart'){var cc2=document.getElementById('cart');if(cc2)cc2.scrollIntoView({behavior:'smooth',block:'start'});}
  else if(a==='copy'){var t=buildText();function done(){var btn=document.getElementById('copyBtn');if(btn){btn.innerHTML=ic('check',15)+'Copied';btn.classList.add('ok');setTimeout(function(){if(btn){btn.innerHTML=ic('copy',15)+'Copy';btn.classList.remove('ok');}},1600);}}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(function(){fb(t,done);});}else fb(t,done);}
});
function fb(t,d){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);d();}
document.addEventListener('input',function(e){
  if(e.target.id==='panelW'){state.panelW=clamp(parseInt(e.target.value||'0',10)||0,0,800);refreshKeepFocus(onPanels);}
  else if(e.target.id==='panelCount'){state.panelCount=clamp(parseInt(e.target.value||'0',10)||0,0,400);refreshKeepFocus(onPanels);}
  else if(e.target.id==='loadKw'){state.loadKw=clamp(parseFloat(e.target.value||'0')||0,0,999);refreshKeepFocus(onLoadKw);}
  else if(e.target.id==='backupLoadKw'){state.backupLoadKw=clamp(parseFloat(e.target.value||'0')||0,0,99);refreshKeepFocus(onBackupLoadKw);}
  else if(e.target.id==='mainFuseA'){state.mainFuseA=clamp(parseInt(e.target.value||'0',10)||0,0,1000);refreshKeepFocus(function(){var sw=document.getElementById('scenewrap');if(sw)sw.innerHTML=housePhotoHTML();});}
  else if(e.target.id&&e.target.id.indexOf('tpLabel')===0){var tpIdx=parseInt(e.target.id.slice(7),10);if(!state.tpLabels)state.tpLabels=['','',''];state.tpLabels[tpIdx]=e.target.value.slice(0,24);refreshKeepFocus(function(){var sw=document.getElementById('scenewrap');if(sw)sw.innerHTML=housePhotoHTML();});}
});
render();
</script>
